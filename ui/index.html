<!DOCTYPE html>
<html lang="en">
<!-- Glitch Studios - glitch-securityCameras (NUI). Copyright (c) 2026 Glitch Studios. See LICENSE. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Camera System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', sans-serif;
        }
        
        .marker-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .x-marker {
            position: absolute;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
        
        .x-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.8);
            top: 50%;
            left: 0;
            transform-origin: center;
            border-radius: 1px;
            box-shadow: 0 0 5px rgba(0, 162, 255, 0.5);
        }
        
        .x-line-1 {
            transform: translateY(-50%) rotate(45deg);
        }
        
        .x-line-2 {
            transform: translateY(-50%) rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="camera-container" id="cameraSystem">
        <div class="camera-overlay">
            <div class="scan-lines"></div>
            <div class="camera-vignette"></div>
        </div>
        
        <div class="camera-reticle">
            <div class="reticle-crosshair"></div>
        </div>
        
        <div class="camera-header">
            <div class="camera-info">
                <div class="camera-label" data-label="camera">CAMERA:</div>
                <div id="cameraId">CAM-001</div>
                <div class="recording-indicator">&#9679; REC</div>
            </div>
            <div class="date-time">
                <div id="timestamp">00:00:00</div>
                <div id="date">01/01/2023</div>
            </div>
        </div>
        
        <div class="camera-details-left">
            <div class="stat-item" id="camera-name">SEC-ENTRANCE-01</div>
            <div class="stat-item" id="camera-location">DIAMOND CASINO RESORT</div>
            <div class="stat-item" id="camera-mode"></div>
        </div>
        
        <div class="camera-stats">
            <div class="stat-item">FPS: 30</div>
            <div class="stat-item">RES: 1080p</div>
            <div class="stat-item">SIGNAL: 96%</div>
        </div>
        
        <div class="interaction-prompt" id="interactionPrompt">
            <span id="interactionText">PRESS E TO HACK</span>
        </div>
        
        <div class="notification" id="notification">
            <span id="notificationText"></span>
        </div>
        
        <div class="camera-footer">
            <div class="controls-info">
                <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> <span data-label="switch">SWITCH CAMERA</span></span>
                <span><kbd>MOUSE</kbd> <span data-label="pan">PAN</span></span>
                <span><kbd>Q</kbd> <span data-label="viewMode">SWITCH VIEW MODE</span></span>
                <span id="interactControl"><kbd>E</kbd> <span data-label="interact">INTERACT</span></span>
                <span><kbd>BKSP</kbd> <span data-label="exit">EXIT</span></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
